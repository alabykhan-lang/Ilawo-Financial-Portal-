name: One-time command-center effective ledgers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/command-center-effective-ledgers.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Make Command Center reports correction-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/command-center.ts')
          text = p.read_text()
          old_external = 'client.from("external_candidate_payments").select("amount_paid,external_candidate_id,payment_date")'
          new_external = 'client.from("effective_external_candidate_payment_ledger").select("amount_paid,external_candidate_id,payment_date")'
          old_expense = 'client.from("school_expenses").select("amount,expense_type,description,expense_date")'
          new_expense = 'client.from("effective_school_expense_ledger").select("amount,expense_type,description,expense_date")'
          if old_external not in text and new_external not in text:
            raise SystemExit('External reporting query marker not found')
          if old_expense not in text and new_expense not in text:
            raise SystemExit('Expense reporting query marker not found')
          text = text.replace(old_external, new_external)
          text = text.replace(old_expense, new_expense)
          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

      - name: Commit verified reporting fix
        shell: bash
        run: |
          rm .github/workflows/command-center-effective-ledgers.yml
          git config user.name "Ilawo Portal Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] Make Command Center reports correction-aware"
          git push origin HEAD:main
