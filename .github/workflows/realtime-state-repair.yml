name: One-time realtime state repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/realtime-state-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Move realtime refresh inside Principal portal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          portal = Path('components/PrincipalPortalV4.tsx')
          text = portal.read_text()
          marker = '  if (!u || !c) return <Login c={c} />;'
          if marker not in text:
              raise SystemExit('Principal portal render marker was not found')

          effect = (
              '  useEffect(() => {\n'
              '    if (!c || !u) return;\n\n'
              '    let refreshTimer: ReturnType<typeof setTimeout> | null = null;\n'
              '    let lastRefreshAt = Date.now();\n\n'
              '    const requestRefresh = () => {\n'
              '      if (refreshTimer) clearTimeout(refreshTimer);\n'
              '      refreshTimer = setTimeout(() => {\n'
              '        lastRefreshAt = Date.now();\n'
              '        void refresh(c, u);\n'
              '      }, 650);\n'
              '    };\n\n'
              '    const channel = c\n'
              '      .channel("ilawo-principal-live-record-book")\n'
              '      .on("postgres_changes", { event: "*", schema: "public" }, requestRefresh)\n'
              '      .subscribe();\n\n'
              '    const refreshAfterBackground = () => {\n'
              '      if (document.visibilityState !== "visible") return;\n'
              '      if (Date.now() - lastRefreshAt >= 15_000) requestRefresh();\n'
              '    };\n\n'
              '    window.addEventListener("focus", refreshAfterBackground);\n'
              '    document.addEventListener("visibilitychange", refreshAfterBackground);\n\n'
              '    return () => {\n'
              '      if (refreshTimer) clearTimeout(refreshTimer);\n'
              '      window.removeEventListener("focus", refreshAfterBackground);\n'
              '      document.removeEventListener("visibilitychange", refreshAfterBackground);\n'
              '      void c.removeChannel(channel);\n'
              '    };\n'
              '  }, [c, u, refresh]);\n\n'
          )

          if 'ilawo-principal-live-record-book' not in text:
              text = text.replace(marker, effect + marker, 1)
          portal.write_text(text)

          Path('app/page.tsx').write_text(
              'import PrincipalPortalV4 from "@/components/PrincipalPortalV4";\n\n'
              'export default function HomePage() {\n'
              '  return <PrincipalPortalV4 />;\n'
              '}\n'
          )

          live = Path('components/PrincipalPortalLive.tsx')
          if live.exists():
              live.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified repair
        shell: bash
        run: |
          rm .github/workflows/realtime-state-repair.yml
          git config user.name "Ilawo Portal Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] Preserve Principal screen during realtime refresh"
          git push origin HEAD:main
