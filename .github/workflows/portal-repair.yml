name: One-time principal portal repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/portal-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply portal repairs
        run: python scripts/repair_portal.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified repair
        run: |
          rm .github/workflows/portal-repair.yml scripts/repair_portal.py
          git config user.name "Ilawo Portal Repair"
          git config user.email "actions@users.noreply.github.com"
          git add components/PrincipalPortalV4.tsx next.config.ts .github/workflows/portal-repair.yml scripts/repair_portal.py
          git commit -m "[skip ci] Repair Principal portal typing and reporting"
          git push origin HEAD:main
